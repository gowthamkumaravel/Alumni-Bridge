# ==========================================
# APPLICATION
# ==========================================

spring.application.name=alumnibridge

server.port=${SERVER_PORT:8085}

# ==========================================
# MYSQL DATABASE
# ==========================================


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aluminibridge}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET:alumnibridge_dev_secret_key_change_me_2026_minimum_32_chars}

# ==========================================
# DOWNSTREAM MICROSERVICES (OpenFeign over Eureka)
# ==========================================
# Service URLs are resolved from Eureka by service name (lb://) — no hardcoded hosts.
internal.api.token=${INTERNAL_API_TOKEN:change_me_internal_shared_token_2026}

# ==========================================
# EUREKA SERVICE DISCOVERY
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ==========================================
# HIKARI CONNECTION POOL
# ==========================================

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-s orter=method

springdoc.swagger-ui.tags-sorter= alpha

springdoc.swagger-ui.doc-expansi on=none

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
