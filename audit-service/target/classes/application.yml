spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:mysql://localhost:3306/audit_db?createDatabaseIfNotExist=true}
    username: ${AUDIT_DB_USER:root}
    password: ${AUDIT_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate          # schema owned by Flyway
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${AUDIT_PORT:8082}

# Same signing secret as the monolith so JWTs issued by auth validate here too
security:
  jwt:
    secret: ${JWT_SECRET:alumnibridge_dev_secret_key_change_me_2026_minimum_32_chars}

# Shared secret guarding /internal/** (the monolith Feign write client must match)
internal:
  api:
    token: ${INTERNAL_API_TOKEN:change_me_internal_shared_token_2026}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
