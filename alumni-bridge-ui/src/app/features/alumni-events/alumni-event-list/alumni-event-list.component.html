<div class="page-container">
  <app-page-header
    title="Alumni Events"
    subtitle="Plan and publish networking, webinar and reunion events"
  >
    <button mat-raised-button color="primary" (click)="create()" *ngIf="canManage">
      <mat-icon>add</mat-icon>
      New Event
    </button>
  </app-page-header>

  <mat-card class="table-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <input matInput placeholder="Title, venue or cohort" [(ngModel)]="filterText" (ngModelChange)="applyFilters()" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="statusFilter" (ngModelChange)="applyFilters()">
          <mat-option value="ALL">All statuses</mat-option>
          <mat-option *ngFor="let s of statuses" [value]="s">{{ s | enumLabel }}</mat-option>
        </mat-select>
      </mat-form-field>
      <span class="spacer"></span>
      <button mat-stroked-button (click)="load()"><mat-icon>refresh</mat-icon> Refresh</button>
    </div>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <table mat-table [dataSource]="dataSource" matSort class="data-table">
      <ng-container matColumnDef="eventId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.eventId }}</td>
      </ng-container>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
        <td mat-cell *matCellDef="let row">{{ row.title }}</td>
      </ng-container>
      <ng-container matColumnDef="eventType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let row">{{ row.eventType | enumLabel }}</td>
      </ng-container>
      <ng-container matColumnDef="eventDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
        <td mat-cell *matCellDef="let row">{{ row.eventDate | date: 'medium' }}</td>
      </ng-container>
      <ng-container matColumnDef="venue">
        <th mat-header-cell *matHeaderCellDef>Venue</th>
        <td mat-cell *matCellDef="let row">{{ row.venue || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="rsvpCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>RSVPs</th>
        <td mat-cell *matCellDef="let row">{{ row.rsvpCount ?? 0 }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let row">
          <span class="status-chip" [ngClass]="statusClass(row.status)">{{ row.status | enumLabel }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col">Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-col">
          <button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="rsvp(row)"><mat-icon>event_available</mat-icon><span>RSVP</span></button>
            <ng-container *ngIf="canManage">
              <button mat-menu-item (click)="edit(row)"><mat-icon>edit</mat-icon><span>Edit</span></button>
              <button mat-menu-item (click)="publish(row)" [disabled]="row.status !== 'PLANNED'"><mat-icon>publish</mat-icon><span>Publish</span></button>
              <button mat-menu-item (click)="complete(row)"><mat-icon>check_circle</mat-icon><span>Complete</span></button>
              <button mat-menu-item (click)="cancel(row)"><mat-icon>cancel</mat-icon><span>Cancel</span></button>
            </ng-container>
            <button mat-menu-item (click)="remove(row)" *ngIf="isAdmin"><mat-icon color="warn">delete</mat-icon><span>Delete</span></button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="no-data-row" [attr.colspan]="displayedColumns.length"><span *ngIf="!loading">No events found.</span></td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" pageSize="10" showFirstLastButtons></mat-paginator>
  </mat-card>
</div>
