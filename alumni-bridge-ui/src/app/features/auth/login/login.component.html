<div
  class="d-flex align-items-center justify-content-center min-vh-100 p-3"
  style="background: #e8eaf1"
>
  <mat-card class="w-100 p-4" style="max-width: 400px">
    <div class="d-flex align-items-center gap-2 mb-1" style="color: #3f51b5">
      <mat-icon>hub</mat-icon>
      <h1 class="m-0 fs-4 fw-medium">Alumni Bridge</h1>
    </div>
    <p class="text-muted small mb-4">Offboarding &amp; alumni engagement platform</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="d-flex flex-column">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="you@company.com"
        />
        <mat-icon matSuffix>mail</mat-icon>
        <mat-error *ngIf="form.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">
          Enter a valid email address
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="'Toggle password visibility'"
        >
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('password')?.hasError('required')">
          Password is required
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="w-100 d-flex align-items-center justify-content-center"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Sign in</span>
        <mat-progress-spinner
          *ngIf="loading"
          mode="indeterminate"
          diameter="20"
        ></mat-progress-spinner>
      </button>
    </form>
  </mat-card>
</div>
